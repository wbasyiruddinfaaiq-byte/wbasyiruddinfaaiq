<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Animal Growth Derivative Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; max-width: 800px; margin: auto; }
        .box { border: 1px solid #ccc; padding: 15px; border-radius: 8px; background: #f9f9f9; }
        canvas { max-width: 100%; height: 400px; }
    </style>
</head>
<body>

    <h2>Livestock Growth Rate Analysis</h2>
    <div class="box">
        <p><strong>Function (Weight):</strong> $f(x) = -0.01x^2 + 2x + 10$</p>
        <p><strong>Derivative (Growth Rate):</strong> $f'(x) = -0.02x + 2$</p>
        <p id="status"><em>Click on a point on the graph to calculate the growth rate at that day.</em></p>
    </div>

    <canvas id="growthChart"></canvas>

    <script>
        const ctx = document.getElementById('growthChart').getContext('2d');
        const labels = Array.from({length: 101}, (_, i) => i);
        const dataPoints = labels.map(x => -0.01 * x**2 + 2 * x + 10);

        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Weight (kg)',
                    data: dataPoints,
                    borderColor: '#2e7d32',
                    fill: false,
                    pointRadius: 2
                }]
            },
            options: {
                responsive: true,
                onClick: (e) => {
                    const elements = chart.getElementsAtEventForMode(e, 'nearest', { intersect: false }, true);
                    if (elements.length > 0) {
                        const index = elements[0].index;
                        const weight = dataPoints[index].toFixed(2);
                        const rate = (-0.02 * index + 2).toFixed(2);
                        document.getElementById('status').innerHTML = 
                            `<strong>Day ${index}:</strong> Weight is <strong>${weight} kg</strong>. ` +
                            `The animal is currently gaining weight at a rate of <strong>${rate} kg/day</strong>.`;
                    }
                }
            }
        });
    </script>
</body>
</html>
